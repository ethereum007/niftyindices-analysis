name: Refresh Nifty Indices
on:
  schedule:
    - cron: '15 13 * * 1-5' # 18:45 IST
    - cron: '15 16 * * 1-5' # 21:45 IST, retry late NSE publications
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nifty-indices-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf==6.10.0
      - name: Refresh and publish verified data
        shell: bash
        run: |
          set -euo pipefail
          report=nifty-automation/data/reports/latest.json
          before=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["as_of"])' "$report")
          python nifty-automation/pipeline.py
          after=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["as_of"])' "$report")
          if [[ "$after" == "$before" ]]; then
            echo "No newer NSE session available ($after)."
            exit 0
          fi
          python - <<'PY'
          import sqlite3
          with sqlite3.connect("nifty-automation/data/warehouse.sqlite") as db:
              if db.execute("PRAGMA integrity_check").fetchone() != ("ok",):
                  raise SystemExit("SQLite integrity check failed")
          PY
          git add -- index-intelligence/dist/index.html index-intelligence/dist/performance-latest.csv nifty-automation/data/raw/*.csv \
            nifty-automation/data/warehouse.sqlite nifty-automation/data/reports \
            nifty-automation/data/history-anchors.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Refresh Nifty Indices for $after"
          git push origin HEAD:main

